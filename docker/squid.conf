http_port 3128

# Default-deny egress allowlist. A leading dot matches the domain and its
# subdomains. Anything not listed here is unreachable from the sealed network,
# so no rule is needed to block a destination - only to permit one.
acl allowed_hosts dstdomain .anthropic.com
acl allowed_hosts dstdomain .claude.ai
# Claude Code signs in against platform.claude.com, a different domain.
acl allowed_hosts dstdomain .claude.com
acl allowed_hosts dstdomain .github.com
acl allowed_hosts dstdomain .githubusercontent.com
acl allowed_hosts dstdomain .clickup.com
acl allowed_hosts dstdomain .rubygems.org
acl allowed_hosts dstdomain .npmjs.org
acl allowed_hosts dstdomain .yarnpkg.com
acl allowed_hosts dstdomain .motherduck.com
acl allowed_hosts dstdomain extensions.duckdb.org
acl allowed_hosts dstdomain sternrisk.omniapp.co

# Tunnels are permitted on the two web ports only, never to arbitrary ports.
# Which HOSTS may be reached is still decided by the allowlist above; port 80
# is here because docker/proxy-tunnel.py tunnels plain-HTTP clients too.
acl tunnel_ports port 80 443
acl CONNECT method CONNECT

http_access deny CONNECT !tunnel_ports
http_access deny !allowed_hosts
http_access allow allowed_hosts
http_access deny all

forwarded_for delete
via off
httpd_suppress_version_string on

cache deny all
# The proxy user cannot open /dev/stdout in this image, so denials land here.
# Read them with: docker compose exec proxy tail -f /var/log/squid/access.log
access_log stdio:/var/log/squid/access.log
